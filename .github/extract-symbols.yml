# Keeps the symbols database (symbols/wordpress.php, symbols/woocommerce.php) in sync with the
# WordPress and WooCommerce versions pinned in composer.json.
#
# Those two files list every WordPress and WooCommerce class, function, constant and namespace that
# PHP Scoper must leave unprefixed, since they are global dependencies shared by every plugin on a
# site. They are generated by scripts/extract-symbols.php, which parses the WordPress core and
# WooCommerce sources that Composer installs into sources/ and walks their AST.
#
# When Dependabot opens a pull request bumping johnpbloch/wordpress or wpackagist-plugin/woocommerce,
# this workflow installs the new sources, regenerates both files and commits the result back onto the
# Dependabot branch, so the symbols land in the same pull request as the version bump.
#
# The job condition restricts runs to Dependabot-authored pull requests, and skips any run whose head
# commit is this workflow's own "Extract symbols" commit — otherwise pushing that commit would
# retrigger the workflow on `synchronize` and loop. It can also be run by hand from the Actions tab
# (workflow_dispatch), which bypasses the Dependabot check and regenerates against whatever the
# checked-out branch has locked.

name: Extract symbols

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-symbols:
    if: ${{ github.event_name == 'workflow_dispatch' || ( github.actor == 'dependabot[bot]' && !contains(github.event.head_commit.message, 'Extract symbols') ) }}
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup PHP
        # https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress
      - name: Run extract script
        run: composer run-script extract
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git add -A
          git commit -m "Extract symbols"
          git push
